[project]
name = "asr"
version = "0.1.0"
description = "Automatic speech recognition algorithm implementation test bed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aim>=3.29.1",
  "einx>=0.4.3",
  "hydra-core>=1.3.2",
  "jaxtyping>=0.3.9",
  "jiwer>=4.0.0",
  "jupyterlab>=4.5.7",
  "matplotlib>=3.10.9",
  "ninja>=1.13.0",
  "nvidia-npp>=13.1.0.48",
  "torch>=2.11.0",
  "torchaudio>=2.11.0",
  "torchcodec>=0.11",
  "tqdm>=4.67.3",
]

[project.scripts]
train = "asr.cli.train:main"
bucket-boundaries = "asr.cli.bucket_boundaries:main"
compute-norm-stats = "asr.cli.compute_norm_stats:main"

[build-system]
requires = ["setuptools>=77", "wheel", "torch>=2.11.0", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]
torchcodec = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "clang-format>=22.1.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# jaxtyping shape strings trip F722/F821, see FAQ
ignore = ["F722", "F821"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]
markers = [
  "cuda: test requires a CUDA device (auto-skipped when unavailable)",
]
